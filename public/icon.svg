<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield/Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 6" />
  
  <!-- Main Emblem Group -->
  <g filter="url(#drop)">
    <!-- Shield Outline -->
    <path d="M256 80 L380 140 C380 270 256 390 256 390 C256 390 132 270 132 140 Z" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Balance / Scaled Beam -->
    <path d="M180 190 L332 190" stroke="#fef3c7" stroke-width="6" stroke-linecap="round" />
    <circle cx="256" cy="190" r="8" fill="#fbbf24" />
    <path d="M256 160 L256 220" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    
    <!-- Left Scale Pan -->
    <path d="M196 190 L180 230 M220 190 L204 230" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" />
    <path d="M168 230 C168 246 216 246 216 230 Z" fill="url(#goldGrad)" />
    
    <!-- Right Scale Pan -->
    <path d="M292 190 L276 230 M316 190 L300 230" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" />
    <path d="M264 230 C264 246 312 246 312 230 Z" fill="url(#goldGrad)" />
    
    <!-- AA Monogram / Pedestal -->
    <text x="256" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="4">AA</text>
    <text x="256" y="352" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fbbf24" letter-spacing="3">CAOMS</text>
  </g>
</svg>
