<!doctype html>
<html lang="en">
  <head>
    <script>
      // 1. React Fast Refresh preamble stubs defined synchronously
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;

      // 2. Mock Vite HMR WebSocket so client connects cleanly without failing or logging [vite] errors in sandbox
      if (typeof window !== 'undefined' && typeof window.WebSocket !== 'undefined') {
        var NativeWebSocket = window.WebSocket;
        function MockHmrSocket(url, protocols) {
          var isHmr = false;
          try {
            var urlStr = (url || '') + '';
            var protoStr = (Array.isArray(protocols) ? protocols.join(' ') : (protocols || '')) + '';
            if (
              protoStr.indexOf('vite') !== -1 ||
              urlStr.indexOf('token=') !== -1 ||
              urlStr.indexOf('vite') !== -1 ||
              urlStr.indexOf(':24678') !== -1 ||
              urlStr.indexOf(':5173') !== -1 ||
              urlStr.indexOf('localhost:3000') !== -1
            ) {
              isHmr = true;
            }
          } catch (e) {}

          if (!isHmr) {
            return new NativeWebSocket(url, protocols);
          }

          var self = Object.create(NativeWebSocket.prototype);
          var listeners = {};

          self.url = url;
          self.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
          self.readyState = 1; // WebSocket.OPEN
          self.OPEN = 1;
          self.CONNECTING = 0;
          self.CLOSING = 2;
          self.CLOSED = 3;
          self.binaryType = 'blob';
          self.bufferedAmount = 0;
          self.extensions = '';
          self.onopen = null;
          self.onclose = null;
          self.onerror = null;
          self.onmessage = null;

          self.addEventListener = function(type, fn) {
            if (!listeners[type]) listeners[type] = [];
            listeners[type].push(fn);
          };

          self.removeEventListener = function(type, fn) {
            if (!listeners[type]) return;
            listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
          };

          self.dispatchEvent = function(event) {
            var handler = self['on' + event.type];
            if (typeof handler === 'function') {
              try { handler.call(self, event); } catch (err) {}
            }
            if (listeners[event.type]) {
              listeners[event.type].slice().forEach(function(cb) {
                try { cb.call(self, event); } catch (err) {}
              });
            }
            return true;
          };

          self.send = function(data) {
            try {
              var parsed = typeof data === 'string' ? JSON.parse(data) : {};
              if (parsed && parsed.type === 'ping') {
                setTimeout(function() {
                  self.dispatchEvent(new MessageEvent('message', {
                    data: JSON.stringify({ type: 'pong' })
                  }));
                }, 10);
              }
            } catch (err) {}
          };

          self.close = function(code, reason) {
            self.readyState = 3;
            self.dispatchEvent(new CloseEvent('close', { code: code || 1000, reason: reason || '', wasClean: true }));
          };

          setTimeout(function() {
            if (self.readyState === 1) {
              self.dispatchEvent(new Event('open'));
              self.dispatchEvent(new MessageEvent('message', {
                data: JSON.stringify({ type: 'connected' })
              }));
            }
          }, 0);

          return self;
        }

        MockHmrSocket.OPEN = 1;
        MockHmrSocket.CONNECTING = 0;
        MockHmrSocket.CLOSING = 2;
        MockHmrSocket.CLOSED = 3;
        MockHmrSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket = MockHmrSocket;
      }

      // 3. Gracefully silence benign development-only Vite notices & suppress [vite] error events
      (function() {
        var isViteNotice = function() {
          for (var i = 0; i < arguments.length; i++) {
            var item = arguments[i];
            if (!item) continue;
            var str = '';
            if (typeof item === 'string') {
              str = item;
            } else if (typeof item === 'object') {
              str = (item.message || '') + ' ' + (item.reason || '') + ' ' + (item.stack || '') + ' ' + (typeof item.toString === 'function' ? item.toString() : '');
            }
            str = str.toLowerCase();
            if (str.indexOf('vite') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('vite-plugin-pwa') !== -1) {
              return true;
            }
          }
          return false;
        };

        ['error', 'warn', 'info', 'debug', 'log'].forEach(function(method) {
          var orig = console[method];
          if (typeof orig === 'function') {
            console[method] = function() {
              if (isViteNotice.apply(null, arguments)) return;
              orig.apply(console, arguments);
            };
          }
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (event && isViteNotice(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event && isViteNotice(event.message, event.error, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
