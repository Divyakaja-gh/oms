    <meta property="og:description" content="Secure, SOC2-ready practice management software for Chartered Accountants with 100% OCR Invoice & Document Intelligence." />

    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Gracefully handle sandboxed container environment where HMR WebSocket is disabled
      (function() {
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args[0] && typeof args[0] === 'string' && (args[0].indexOf('[vite]') !== -1 || args[0].indexOf('vite-plugin-pwa') !== -1)) {
            return;
          }
          origError.apply(console, args);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args[0] && typeof args[0] === 'string' && (args[0].indexOf('[vite]') !== -1 || args[0].indexOf('vite-plugin-pwa') !== -1)) {
            return;
          }
          origWarn.apply(console, args);
        };

        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && url.indexOf('token=') !== -1 && url.indexOf('vite') !== -1)) {
              var wsMock = new EventTarget();
              wsMock.OPEN = 1;
              wsMock.CLOSED = 3;
              wsMock.readyState = 1;
              wsMock.send = function() {};
              wsMock.close = function() {};
              setTimeout(function() {
                try {
                  wsMock.dispatchEvent(new Event('open'));
                } catch(e) {}
              }, 10);
              return wsMock;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>

    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#4338ca" />
